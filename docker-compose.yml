# Alternative à l'installation pip : make up / make down
services:
  litellm:
    # Version epinglee = celle validee dans le venv (requirements.txt) ;
    # main-latest peut changer de comportement (routage Responses API...).
    image: ghcr.io/berriai/litellm:v1.96.2
    container_name: cc-scaleway-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-4000}:4000"
    environment:
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:?SCW_SECRET_KEY manquant — voir .env.example}
      PROXY_KEY: ${PROXY_KEY:-sk-local-dev-1234}
      # Diagnostic : SCW_CAPTURE=1 dumpe les requetes a outils dans docker logs.
      SCW_CAPTURE: ${SCW_CAPTURE:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./custom_callbacks.py:/app/custom_callbacks.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      # L'image litellm n'embarque PAS curl -> le healthcheck curl echouait
      # toujours (conteneur marque "unhealthy" a tort). On utilise le python
      # du venv, present par definition.
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
