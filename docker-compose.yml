# Alternative à l'installation pip : make up / make down
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: cc-scaleway-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-4000}:4000"
    environment:
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:?SCW_SECRET_KEY manquant — voir .env.example}
      PROXY_KEY: ${PROXY_KEY:-sk-local-dev-1234}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./custom_callbacks.py:/app/custom_callbacks.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
