# LiteLLM — expose un modèle Scaleway (API OpenAI) au format Anthropic
# pour Claude Code.
#
#   Claude Code ──/v1/messages (Anthropic)──▶ LiteLLM ──/chat/completions (OpenAI)──▶ Scaleway
#
# Lancement :  make proxy   (ou : litellm --config config.yaml --port 4000)

model_list:
  # ── Modèle principal ────────────────────────────────────────────────
  # Vérifie l'ID exact avec `make models` avant de compter dessus.
  # Préfixe hosted_vllm/ (et non openai/) : même protocole OpenAI, mais
  # LiteLLM ne suppose pas la Responses API — le provider openai/ tente
  # /v1/responses/input_tokens à chaque count_tokens (404 Scaleway).
  - model_name: deepseek-v4-flash-0731
    litellm_params:
      model: hosted_vllm/deepseek-v4-flash-0731
      api_base: https://api.scaleway.ai/v1
      api_key: os.environ/SCW_SECRET_KEY
    model_info:
      supports_function_calling: true

  # ── Alias ───────────────────────────────────────────────────────────
  # Claude Code réclame des noms de modèles Claude par défaut — y compris
  # les IDs versionnés pour les tâches de fond. Sans ces alias, tu
  # récupères des erreurs "model not found" même si --model est correct.
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: hosted_vllm/deepseek-v4-flash-0731
      api_base: https://api.scaleway.ai/v1
      api_key: os.environ/SCW_SECRET_KEY

  - model_name: claude-sonnet-4-5-20250929
    litellm_params:
      model: hosted_vllm/deepseek-v4-flash-0731
      api_base: https://api.scaleway.ai/v1
      api_key: os.environ/SCW_SECRET_KEY

  # Modèle rapide (résumés, titres de conversation). Bascule-le sur un
  # modèle moins cher — ex. hosted_vllm/gpt-oss-120b — pour alléger la facture.
  - model_name: claude-haiku-4-5
    litellm_params:
      model: hosted_vllm/deepseek-v4-flash-0731
      api_base: https://api.scaleway.ai/v1
      api_key: os.environ/SCW_SECRET_KEY

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: hosted_vllm/deepseek-v4-flash-0731
      api_base: https://api.scaleway.ai/v1
      api_key: os.environ/SCW_SECRET_KEY

litellm_settings:
  # Ignore les paramètres Anthropic sans équivalent OpenAI (cache_control,
  # thinking...) au lieu de renvoyer une 400. Indispensable ici.
  drop_params: true

  # Garde-fous serveur (custom_callbacks.py) : (1) écrête max_tokens à la limite
  # Scaleway du modèle (deepseek-v4-flash-0731 : 32768) — certains appels
  # internes de Claude Code ignorent CLAUDE_CODE_MAX_OUTPUT_TOKENS et partiraient
  # sinon en 400 ; (2) rattrape les tool-calls que DeepSeek V4 émet parfois en
  # texte (format ｜DSML｜) au lieu d'un appel structuré, et les reconstruit en
  # vrai tool_use (contournement d'un bug Scaleway — voir le fichier).
  callbacks: custom_callbacks.proxy_handler_instance

  # LiteLLM ≥ 1.9x route les requêtes /v1/messages des modèles `openai/`
  # vers /v1/responses. Scaleway n'implémente pas cette route (422
  # "ROUTE NOT SUPPORTED") : on force le pont chat/completions.
  use_chat_completions_url_for_anthropic_messages: true

  # Passe à true pour voir les requêtes traduites dans la console.
  set_verbose: false

general_settings:
  # Doit correspondre à PROXY_KEY dans .env, et donc à ANTHROPIC_AUTH_TOKEN.
  master_key: os.environ/PROXY_KEY
